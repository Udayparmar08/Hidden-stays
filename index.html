    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;

body{
    font-family:'Poppins',sans-serif;
    background:#f8f6f2;
    color:#1c1917;
    overflow-x: hidden;
}

header{
    position:absolute;

    width:100%;

    justify-style:space-between;

nav ul{
    display:flex;
    gap:30px;
    list-style:none;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-size:14px;
    transition: opacity 0.2s;
}

nav ul li a:hover{
    opacity: 0.8;
}

.btn{
    background:white;
    color:#222;
    padding:12px 25px;
    border-radius:30px;
    text-decoration:none;
    font-weight:600;
    transition: transform 0.2s, background 0.2s;
}

.btn:hover{
    transform: translateY(-2px);
    background: #f0ece1;
}

.hero{

    background:
    linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.45)),

    align-items:center;

}

.hero-content{
    color:white;
    max-width:650px;
}

.hero h1{
    font-size:70px;
    line-height:1.1;
    font-family:'Playfair Display',serif;
    margin-bottom:20px;
}

.hero p{
    font-size:20px;
    margin-bottom:30px;
}

.explore-btn{
    background:#314232;
    color:white;
    text-decoration:none;
    padding:15px 35px;
    border-radius:50px;
    display: inline-block;
    transition: background 0.3s, transform 0.2s;
}

.explore-btn:hover{
    background: #1c241d;
    transform: translateY(-2px);
}
